<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ARCADIA — 9 MAI</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
html, body { width:100%; height:100%; background:#000; overflow:hidden; font-family:'Courier New','Lucida Console',monospace; cursor:none; }
canvas#bg { position:fixed; top:0; left:0; width:100%; height:100%; z-index:0; }
#scanline {
  position:fixed; top:0; left:0; width:100%; height:100%;
  background:repeating-linear-gradient(to bottom,transparent 0px,transparent 2px,rgba(0,0,0,0.07) 2px,rgba(0,0,0,0.07) 4px);
  z-index:2; pointer-events:none;
}
#vignette {
  position:fixed; top:0; left:0; width:100%; height:100%;
  background:radial-gradient(ellipse at center,transparent 50%,rgba(0,0,0,0.88) 100%);
  z-index:3; pointer-events:none;
}
#statusbar { position:fixed; bottom:24px; left:32px; z-index:10; font-size:11px; letter-spacing:0.12em; opacity:0.45; color:#fff; text-transform:uppercase; }
#clock     { position:fixed; top:24px; right:32px; z-index:10; font-size:12px; letter-spacing:0.2em; opacity:0.4; color:#fff; }
#corner-tl { position:fixed; top:20px; left:24px; z-index:10; font-size:11px; letter-spacing:0.15em; opacity:0.3; color:#fff; text-transform:uppercase; }
#webcam    { position:fixed; top:-9999px; left:-9999px; width:320px; height:240px; }
#camstatus { position:fixed; bottom:24px; right:32px; z-index:10; font-size:10px; letter-spacing:0.1em; opacity:0.5; color:#fff; text-transform:uppercase; transition:color 0.5s; }
#camstatus.active { color:#00ff9d; opacity:0.7; }
#camstatus.error  { color:#ff4444; opacity:0.7; }
</style>
</head>
<body>

<canvas id="bg"></canvas>
<video id="webcam" autoplay muted playsinline></video>
<div id="scanline"></div>
<div id="vignette"></div>
<div id="statusbar">SYS::ARCADIA_V2 — STREAM ACTIF — <span id="fps">--</span> FPS</div>
<div id="clock"></div>
<div id="corner-tl">STUDIO EYA / 9 MAI</div>
<div id="camstatus">CAM::INIT…</div>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>

<script>
// ═══════════════════════════════════════════════════════════
//  CANVAS
// ═══════════════════════════════════════════════════════════
const canvas = document.getElementById('bg');
const ctx    = canvas.getContext('2d');
let W, H;

// ═══════════════════════════════════════════════════════════
//  MOTS-CLÉS
// ═══════════════════════════════════════════════════════════
const KEYWORDS = [
  { text:'9 MAI',             weight:4 },
  { text:'ARCADIA',           weight:5 },
  { text:'ART NUMERIQUE',     weight:3 },
  { text:'REALITE VIRTUELLE', weight:3 },
  { text:'ARCADE',            weight:4 },
  { text:'IMMERSIVE',         weight:4 },
];

// ═══════════════════════════════════════════════════════════
//  PALETTES
// ═══════════════════════════════════════════════════════════
const PALETTES = [
  { base:'#00ff9d', accent:'#00d4ff', key:'#ff00c8' },
  { base:'#ff6f00', accent:'#ffcc00', key:'#ff0055' },
  { base:'#cc44ff', accent:'#8844ff', key:'#00ffcc' },
  { base:'#44d9ff', accent:'#ffffff', key:'#ff6688' },
  { base:'#aaff00', accent:'#00ff99', key:'#ff4444' },
];
let curPI=0, nxtPI=1, palBlend=0, palCycle=0;
const PAL_DUR = 2200;

function lerpHex(a,b,t) {
  const ah=parseInt(a.slice(1,7),16), bh=parseInt(b.slice(1,7),16);
  const ar=(ah>>16)&255, ag=(ah>>8)&255, ab=ah&255;
  const br=(bh>>16)&255, bg=(bh>>8)&255, bb=bh&255;
  return '#'+[ar+(br-ar)*t, ag+(bg-ag)*t, ab+(bb-ab)*t].map(v=>Math.round(v).toString(16).padStart(2,'0')).join('');
}
function getPal() {
  const a=PALETTES[curPI], b=PALETTES[nxtPI], t=palBlend;
  return { base:lerpHex(a.base,b.base,t), accent:lerpHex(a.accent,b.accent,t), key:lerpHex(a.key,b.key,t) };
}

// ═══════════════════════════════════════════════════════════
//  DÉTECTION DE MAINS — MediaPipe
// ═══════════════════════════════════════════════════════════
let handPoints = [];  // [{x,y,r}, …] — points d'influence en pixels écran
const HAND_R     = 100;   // rayon répulsion px
const REP_FORCE  = 4.0;   // force maximale
const DEF_DECAY  = 0.86;  // amortissement

const camEl  = document.getElementById('webcam');
const camSt  = document.getElementById('camstatus');

// Landmarks retenus : poignet, bases, bouts de doigts
const KEY_LM = [0,1,2,4,5,6,8,9,10,12,13,14,16,17,18,20];

function initHands() {
  if (!navigator.mediaDevices || !window.Hands) {
    camSt.textContent = 'CAM::INDISPONIBLE';
    camSt.classList.add('error');
    return;
  }

  const hands = new Hands({
    locateFile: f => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${f}`
  });
  hands.setOptions({ maxNumHands:2, modelComplexity:0, minDetectionConfidence:0.6, minTrackingConfidence:0.5 });

  hands.onResults(res => {
    handPoints = [];
    if (!res.multiHandLandmarks) return;
    for (const lms of res.multiHandLandmarks) {
      for (const idx of KEY_LM) {
        const lm = lms[idx];
        // miroir horizontal (webcam retournée)
        handPoints.push({ x:(1-lm.x)*W, y:lm.y*H, r:HAND_R });
      }
    }
  });

  const cam = new Camera(camEl, {
    onFrame: async () => { await hands.send({ image: camEl }); },
    width:320, height:240
  });

  cam.start()
    .then(() => { camSt.textContent='CAM::MAINS ACTIVES'; camSt.classList.add('active'); })
    .catch(() => { camSt.textContent='CAM::ACCÈS REFUSÉ'; camSt.classList.add('error'); });
}

// Force de répulsion appliquée à un point (px,py)
function repulsion(px, py) {
  let dx=0, dy=0;
  for (const hp of handPoints) {
    const ex=px-hp.x, ey=py-hp.y;
    const d=Math.sqrt(ex*ex+ey*ey);
    if (d<hp.r && d>1) {
      const f = REP_FORCE * Math.pow(1-d/hp.r, 2.0);
      dx += (ex/d)*f;
      dy += (ey/d)*f;
    }
  }
  return {dx, dy};
}

// ═══════════════════════════════════════════════════════════
//  STREAMS — pluie de caractères
// ═══════════════════════════════════════════════════════════
const FS = 14;
let cols, rows, streams=[];

const CL = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789!@#$%^&*()_+-=[]{}|;:,.<>?/~`\\';
const CJ = 'アイウエオカキクケコサシスセソタチツテトナニヌネノハヒフヘホマミムメモヤユヨラリルレロワヲン';
const CS = '░▒▓│┤╣║╗╝┐└┴┬├─┼╚╔╩╦╠═╬┘┌';
function rc() {
  const r=Math.random();
  if(r<0.5) return CL[Math.floor(Math.random()*CL.length)];
  if(r<0.8) return CJ[Math.floor(Math.random()*CJ.length)];
  return CS[Math.floor(Math.random()*CS.length)];
}

function mkStream(col, rand) {
  const len=6+Math.floor(Math.random()*22);
  const spd=0.4+Math.random()*1.2;
  const y=rand ? Math.random()*-rows : -len;
  let kw=null;
  if(Math.random()<0.09){
    const pool=[];
    KEYWORDS.forEach(k=>{ for(let i=0;i<k.weight;i++) pool.push(k.text); });
    kw=pool[Math.floor(Math.random()*pool.length)];
  }
  return { col, y, len, spd, chars:[], kw, kwp:0, glitch:0,
           dvx:0, dvy:0, dx:0, dy:0, // déviation physique
           sparks:[] };
}

function initStreams() {
  cols=Math.floor(W/FS); rows=Math.floor(H/FS);
  streams=[];
  for(let c=0;c<cols;c++) streams.push(mkStream(c,true));
}

// Étincelles globales
let sparks=[];
function addSparks(x,y,pal,n=2) {
  for(let i=0;i<n;i++) sparks.push({
    x,y, vx:(Math.random()-0.5)*7, vy:-2.5-Math.random()*4,
    life:1, ch:rc(), col:Math.random()<0.5?pal.key:pal.accent
  });
}

function updStream(s, pal) {
  // Chars
  while(s.chars.length<s.len) s.chars.push(rc());
  if(Math.random()<0.3) s.chars[Math.floor(Math.random()*s.chars.length)]=rc();
  s.glitch = Math.random()<0.002 ? 3 : Math.max(0,s.glitch-1);

  // Position tête
  const hx = s.col*FS + s.dx;
  const hy = Math.floor(s.y)*FS;

  // Répulsion
  const rep = repulsion(hx, hy);
  s.dvx = (s.dvx + rep.dx*0.55) * DEF_DECAY;
  s.dvy = (s.dvy + rep.dy*0.4)  * DEF_DECAY;
  s.dx  = s.dx*0.93 + s.dvx;
  s.dy += s.dvy;

  // Étincelles si contact fort
  const rmag = Math.sqrt(rep.dx*rep.dx+rep.dy*rep.dy);
  if(rmag>0.9 && Math.random()<0.35) addSparks(hx, hy, pal);

  // Descente (ralentie par répulsion verticale)
  s.y += s.spd * Math.max(0.1, 1 - Math.abs(s.dvy)*0.35);

  // Reset si hors écran
  if(s.y - s.len > rows+2) {
    const ns=mkStream(s.col,false);
    ns.dx=s.dx; ns.dvx=s.dvx;
    Object.assign(s,ns); s.chars=[];
  }
}

function drawStreams(pal) {
  ctx.font=`${FS}px 'Courier New',monospace`;
  for(const s of streams) {
    const bx = s.col*FS + s.dx;
    for(let i=0;i<s.len;i++) {
      const row=Math.floor(s.y)-i;
      if(row<0||row>rows) continue;
      const py = row*FS + s.dy;
      const frac=1-i/s.len;

      let color;
      if(i===0) {
        const near=handPoints.some(hp=>{ const ex=bx-hp.x,ey=py-hp.y; return Math.sqrt(ex*ex+ey*ey)<hp.r*0.5; });
        color = near ? pal.key : (s.glitch>0 ? pal.accent : '#ffffff');
        ctx.shadowColor = near ? pal.key : pal.base;
        ctx.shadowBlur  = near ? 22 : 8;
      } else {
        const a=Math.pow(frac,1.6);
        color = frac>0.65 ? pal.base : pal.base+Math.floor(a*80).toString(16).padStart(2,'0');
        ctx.shadowBlur=0;
      }

      let ch=s.chars[i]||rc();
      if(s.kw && i===0) {
        ch=s.kw[s.kwp%s.kw.length];
        if(Math.random()<0.05) s.kwp++;
        color=pal.key; ctx.shadowColor=pal.key; ctx.shadowBlur=14;
      }

      ctx.fillStyle=color;
      ctx.fillText(ch, bx+(s.glitch>0?(Math.random()-0.5)*5:0), py);
    }
    ctx.shadowBlur=0;
  }
}

// ═══════════════════════════════════════════════════════════
//  ÉTINCELLES
// ═══════════════════════════════════════════════════════════
function updSparks() {
  for(let i=sparks.length-1;i>=0;i--) {
    const sp=sparks[i];
    sp.x+=sp.vx; sp.y+=sp.vy; sp.vy+=0.2; sp.life-=0.038;
    if(sp.life<=0) sparks.splice(i,1);
  }
}
function drawSparks() {
  ctx.font=`11px 'Courier New',monospace`;
  for(const sp of sparks) {
    ctx.globalAlpha=sp.life;
    ctx.fillStyle=sp.col; ctx.shadowColor=sp.col; ctx.shadowBlur=9;
    ctx.fillText(sp.ch,sp.x,sp.y);
  }
  ctx.shadowBlur=0; ctx.globalAlpha=1;
}

// ═══════════════════════════════════════════════════════════
//  AURA MAINS
// ═══════════════════════════════════════════════════════════
let auraPhase=0;
function drawHandAuras(pal) {
  if(!handPoints.length) return;
  auraPhase+=0.04;
  const pulse=0.6+0.4*Math.sin(auraPhase);

  // Un seul cercle par paire de points (on en prend 1 sur 4 pour la perf)
  for(let i=0;i<handPoints.length;i+=4) {
    const hp=handPoints[i];
    // Halo dégradé
    const g=ctx.createRadialGradient(hp.x,hp.y,2,hp.x,hp.y,hp.r*pulse);
    g.addColorStop(0,   pal.key+'30');
    g.addColorStop(0.4, pal.key+'10');
    g.addColorStop(1,   pal.key+'00');
    ctx.fillStyle=g;
    ctx.beginPath(); ctx.arc(hp.x,hp.y,hp.r*pulse,0,Math.PI*2); ctx.fill();

    // Point central
    ctx.shadowColor=pal.key; ctx.shadowBlur=16;
    ctx.fillStyle=pal.key+'bb';
    ctx.beginPath(); ctx.arc(hp.x,hp.y,4,0,Math.PI*2); ctx.fill();
    ctx.shadowBlur=0;

    // Cercle de rayon
    ctx.strokeStyle=pal.key+'22';
    ctx.lineWidth=1;
    ctx.beginPath(); ctx.arc(hp.x,hp.y,hp.r,0,Math.PI*2); ctx.stroke();
  }
}

// ═══════════════════════════════════════════════════════════
//  LIGNES TERMINALES HORIZONTALES
// ═══════════════════════════════════════════════════════════
let hLines=[];
const TPFX=['> INIT','>> EXEC','[SYS]','[NET]','>>> RUN','[LOG]','LOAD::','PROC::','SCAN::','FLUX::','LINK::','DATA::'];
const TVRB=['render','compile','stream','decode','sync','analyze','process','inject','project','map','generate','trace'];
const TNON=['module','layer','fragment','node','sequence','matrix','vector','signal','channel','instance','frame','entity'];
function genTL(){
  const p=TPFX[Math.floor(Math.random()*TPFX.length)];
  const v=TVRB[Math.floor(Math.random()*TVRB.length)];
  const n=TNON[Math.floor(Math.random()*TNON.length)];
  const h=Math.floor(Math.random()*0xFFFFFF).toString(16).toUpperCase().padStart(6,'0');
  const d=Math.floor(Math.random()*9999).toString().padStart(4,'0');
  return `${p} ${v.toUpperCase()}_${n.toUpperCase()} [0x${h}] (${d})`;
}
function spawnHL(){
  if(hLines.length>6) return;
  hLines.push({y:Math.floor(Math.random()*rows),opacity:0,phase:'in',text:genTL(),scroll:0,spd:0.5+Math.random()*0.8,t:0});
}
function updHL(){
  for(let i=hLines.length-1;i>=0;i--){
    const h=hLines[i]; h.scroll+=h.spd;
    if(h.phase==='in'){h.opacity=Math.min(1,h.opacity+0.04);if(h.opacity>=1)h.phase='hold';}
    if(h.phase==='hold'){h.t++;if(h.t>120)h.phase='out';}
    if(h.phase==='out'){h.opacity=Math.max(0,h.opacity-0.025);if(h.opacity<=0)hLines.splice(i,1);}
  }
  if(Math.random()<0.008) spawnHL();
}
function drawHL(pal){
  ctx.font=`12px 'Courier New',monospace`;
  for(const h of hLines){
    ctx.globalAlpha=h.opacity*0.65;
    ctx.fillStyle=pal.accent; ctx.shadowColor=pal.accent; ctx.shadowBlur=5;
    ctx.fillText(h.text,-(h.scroll%(W+800))+100,h.y*FS);
    ctx.shadowBlur=0;
  }
  ctx.globalAlpha=1;
}

// ═══════════════════════════════════════════════════════════
//  MOTS-CLÉS FLOTTANTS
// ═══════════════════════════════════════════════════════════
let fWords=[];
function spawnFW(){
  if(fWords.length>8) return;
  const pool=[];
  KEYWORDS.forEach(k=>{for(let i=0;i<k.weight;i++) pool.push(k.text);});
  fWords.push({
    text:pool[Math.floor(Math.random()*pool.length)],
    x:0.05+Math.random()*0.88, y:0.05+Math.random()*0.88,
    fs:16+Math.floor(Math.random()*38),
    op:0, ph:'in', t:0,
    drift:(Math.random()-0.5)*0.0002,
    glitch:0, ct:Math.random()<0.5?'key':'accent'
  });
}
function updFW(){
  for(let i=fWords.length-1;i>=0;i--){
    const w=fWords[i]; w.y+=w.drift; w.t++;
    w.glitch=Math.random()<0.008?4:Math.max(0,w.glitch-1);
    if(w.ph==='in'){w.op=Math.min(0.92,w.op+0.015);if(w.op>=0.9)w.ph='hold';}
    if(w.ph==='hold'){if(w.t>200+Math.random()*300)w.ph='out';}
    if(w.ph==='out'){w.op=Math.max(0,w.op-0.008);if(w.op<=0)fWords.splice(i,1);}
  }
  if(Math.random()<0.006) spawnFW();
}
function drawFW(pal){
  for(const w of fWords){
    const x=w.x*W, y=w.y*H, color=w.ct==='key'?pal.key:pal.accent;
    ctx.globalAlpha=w.op;
    ctx.font=`bold ${w.fs}px 'Courier New',monospace`;
    const gx=w.glitch>0?(Math.random()-0.5)*6:0;
    const gy=w.glitch>0?(Math.random()-0.5)*3:0;
    ctx.fillStyle='#000000aa'; ctx.fillText(w.text,x+2+gx,y+2+gy);
    ctx.shadowColor=color; ctx.shadowBlur=18; ctx.fillStyle=color;
    ctx.fillText(w.text,x+gx,y+gy);
    if(w.glitch>0){ctx.globalAlpha=w.op*0.35;ctx.fillStyle=pal.base;ctx.fillText(w.text,x+gx+4,y+gy-2);}
    ctx.shadowBlur=0; ctx.globalAlpha=1;
  }
}

// ═══════════════════════════════════════════════════════════
//  GLITCH GLOBAL
// ═══════════════════════════════════════════════════════════
let gGlitch=0;
function trigGlitch(){gGlitch=8+Math.floor(Math.random()*12);}
function drawGlitch(){
  if(gGlitch<=0) return;
  for(let i=0;i<Math.floor(gGlitch/2);i++){
    try{
      const sy=Math.random()*H, sh=2+Math.random()*12, sx=(Math.random()-0.5)*40;
      ctx.putImageData(ctx.getImageData(0,sy,W,sh),sx,sy);
    }catch(e){}
  }
  gGlitch--;
}

// ═══════════════════════════════════════════════════════════
//  BOUCLE
// ═══════════════════════════════════════════════════════════
const fpsEl=document.getElementById('fps');
const clockEl=document.getElementById('clock');
let lt=0, fc=0, ft=0;

function updClock(){
  const n=new Date();
  if(clockEl) clockEl.textContent=[n.getHours(),n.getMinutes(),n.getSeconds()].map(v=>v.toString().padStart(2,'0')).join(':');
}

function loop(ts){
  const dt=ts-lt; lt=ts; fc++; ft+=dt; palCycle++;

  if(ft>1000){
    if(fpsEl) fpsEl.textContent=Math.round(fc*1000/ft);
    fc=0; ft=0; updClock();
  }

  palBlend=(palCycle%PAL_DUR)/PAL_DUR;
  if(palCycle%PAL_DUR===0){ curPI=nxtPI; nxtPI=(nxtPI+1)%PALETTES.length; }

  const pal=getPal();

  // Fond persistant
  ctx.fillStyle='rgba(0,0,0,0.082)';
  ctx.fillRect(0,0,W,H);

  // Auras avant streams (en dessous)
  drawHandAuras(pal);

  // Update
  streams.forEach(s=>updStream(s,pal));
  updSparks(); updHL(); updFW();
  if(Math.random()<0.001) trigGlitch();

  // Draw
  drawStreams(pal);
  drawSparks();
  drawHL(pal);
  drawFW(pal);
  drawGlitch();

  requestAnimationFrame(loop);
}

function resize(){
  W=canvas.width=window.innerWidth;
  H=canvas.height=window.innerHeight;
  initStreams();
}
window.addEventListener('resize',resize);
resize();

for(let i=0;i<5;i++) spawnFW();
for(let i=0;i<3;i++) spawnHL();
requestAnimationFrame(loop);

// Init hands après chargement des scripts CDN
window.addEventListener('load',()=>{ setTimeout(initHands,600); });

document.addEventListener('dblclick',()=>{
  if(!document.fullscreenElement) document.documentElement.requestFullscreen?.();
  else document.exitFullscreen?.();
});
</script>
</body>
</html>
