<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>VR TAG</title>
  <!-- Three.js bundled as global (window.THREE) — no module imports -->
  <script src="/three.global.js"></script>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap');
    *{margin:0;padding:0;box-sizing:border-box;}
    body{background:#000;overflow:hidden;font-family:'Orbitron',monospace;}
    canvas{display:block;}

    #overlay{
      position:fixed;inset:0;z-index:100;
      display:flex;flex-direction:column;align-items:center;justify-content:center;
      background:rgba(0,0,10,.92);backdrop-filter:blur(12px);
      transition:opacity .4s;
    }
    #overlay.hidden{opacity:0;pointer-events:none;}
    #overlay h1{
      font-size:clamp(48px,12vw,96px);font-weight:900;letter-spacing:10px;
      color:#fff;text-shadow:0 0 40px #00f5ff,0 0 80px #00f5ff55;margin-bottom:12px;
    }
    #overlay p{
      font-size:15px;color:#00f5ff;letter-spacing:3px;
      text-align:center;line-height:2.2;font-family:monospace;
      max-width:460px;padding:0 24px;white-space:pre-line;
    }
    #overlay small{
      margin-top:28px;padding:8px 24px;
      border:1px solid #00f5ff22;color:#555;
      font-family:monospace;font-size:11px;letter-spacing:3px;
    }
    #enter-vr-btn{
      margin-top:28px;padding:14px 40px;
      background:transparent;border:2px solid #00f5ff;
      color:#00f5ff;font-family:'Orbitron',monospace;font-size:14px;
      letter-spacing:4px;cursor:pointer;
      text-shadow:0 0 10px #00f5ff;box-shadow:0 0 20px #00f5ff33;
      transition:all .2s;
    }
    #enter-vr-btn:hover{background:#00f5ff22;box-shadow:0 0 30px #00f5ff55;}
    #enter-vr-btn:disabled{opacity:.3;cursor:default;}

    #hud{position:fixed;inset:0;pointer-events:none;z-index:50;}
    #timer{
      position:absolute;top:20px;left:50%;transform:translateX(-50%);
      font-size:56px;font-weight:900;color:#fff;letter-spacing:4px;
      text-shadow:0 0 20px #00f5ff;
    }
    #timer.urgent{color:#ff2244;text-shadow:0 0 20px #ff2244;animation:pulse .5s infinite alternate;}
    @keyframes pulse{from{opacity:1}to{opacity:.5}}
    #status{
      position:absolute;bottom:60px;left:50%;transform:translateX(-50%);
      font-size:16px;font-weight:700;color:#00f5ff;letter-spacing:2px;
    }
    #status.it{color:#ff2244;text-shadow:0 0 15px #ff2244;}
    #crosshair{
      position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
      width:20px;height:20px;
    }
    #crosshair::before,#crosshair::after{
      content:'';position:absolute;background:rgba(255,255,255,.7);border-radius:1px;
    }
    #crosshair::before{width:2px;height:100%;left:50%;top:0;transform:translateX(-50%);}
    #crosshair::after{width:100%;height:2px;top:50%;left:0;transform:translateY(-50%);}
    #ammo{
      position:absolute;bottom:28px;left:50%;transform:translateX(-50%);
      display:flex;gap:8px;
    }
    .dot{width:10px;height:10px;border-radius:50%;background:#00f5ff;box-shadow:0 0 8px #00f5ff;transition:all .2s;}
    .dot.empty{background:transparent;border:1px solid #333;box-shadow:none;}
    #scores{
      position:absolute;top:20px;right:24px;
      font-family:monospace;font-size:13px;color:#888;text-align:right;line-height:1.8;
    }
    #flash{position:fixed;inset:0;z-index:200;pointer-events:none;background:#fff;opacity:0;transition:opacity .05s;}
  </style>
</head>
<body>

<div id="overlay">
  <h1>VR TAG</h1>
  <p id="overlay-msg">Connexion au serveur...</p>
  <small id="overlay-badge">EN ATTENTE</small>
  <button id="enter-vr-btn" disabled>ENTRER EN VR</button>
</div>

<div id="hud">
  <div id="timer">--</div>
  <div id="status">En attente...</div>
  <div id="crosshair"></div>
  <div id="ammo"></div>
  <div id="scores"></div>
</div>
<div id="flash"></div>

<script>
// THREE is now global via three.global.js
(function() {

// ─────────────────────────────────────────────────────────────
// RENDERER + SCENE
// ─────────────────────────────────────────────────────────────
var renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.xr.enabled = true;
renderer.shadowMap.enabled = true;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
document.body.appendChild(renderer.domElement);

var scene = new THREE.Scene();
scene.background = new THREE.Color(0x050510);
scene.fog = new THREE.Fog(0x050510, 20, 40);

window.addEventListener('resize', function() {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// ─────────────────────────────────────────────────────────────
// CAMERA + RIG
// ─────────────────────────────────────────────────────────────
var camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.01, 100);
camera.position.set(0, 1.65, 0);

var rig = new THREE.Group();
rig.position.set(0, 0, 3);
rig.add(camera);
scene.add(rig);

// ─────────────────────────────────────────────────────────────
// LIGHTING
// ─────────────────────────────────────────────────────────────
scene.add(new THREE.AmbientLight(0x0a0a22, 3));
var dirLight = new THREE.DirectionalLight(0xeeeeff, 1.2);
dirLight.position.set(4, 8, 4);
dirLight.castShadow = true;
scene.add(dirLight);

var ptCenter = new THREE.PointLight(0x00f5ff, 2, 15);
ptCenter.position.set(0, 3.5, 0);
scene.add(ptCenter);

[[-6,-6],[6,-6],[-6,6],[6,6]].forEach(function(xz) {
  var pt = new THREE.PointLight(0xaa00ff, 1.5, 8);
  pt.position.set(xz[0], 3, xz[1]);
  scene.add(pt);
});

// ─────────────────────────────────────────────────────────────
// ARENA
// ─────────────────────────────────────────────────────────────
function stdMat(color, emissive, emissiveInt, opacity, metalness, roughness) {
  emissiveInt = emissiveInt || 0; opacity = opacity === undefined ? 1 : opacity;
  metalness = metalness || 0; roughness = roughness === undefined ? 1 : roughness;
  return new THREE.MeshStandardMaterial({
    color: color, emissive: emissive || 0x000000, emissiveIntensity: emissiveInt,
    transparent: opacity < 1, opacity: opacity, metalness: metalness, roughness: roughness
  });
}

var floor = new THREE.Mesh(new THREE.PlaneGeometry(30, 30), stdMat(0x08081a, 0, 0, 1, 0.1, 0.9));
floor.rotation.x = -Math.PI / 2;
floor.receiveShadow = true;
scene.add(floor);

var gridMat = new THREE.MeshBasicMaterial({ color: 0x00f5ff, transparent: true, opacity: 0.08 });
[-6, 0, 6].forEach(function(v) {
  var mz = new THREE.Mesh(new THREE.BoxGeometry(0.02, 0.01, 16), gridMat);
  mz.position.set(v, 0.01, 0); scene.add(mz);
  var mx = new THREE.Mesh(new THREE.BoxGeometry(16, 0.01, 0.02), gridMat);
  mx.position.set(0, 0.01, v); scene.add(mx);
});

var borderMat = new THREE.MeshStandardMaterial({ color: 0x00f5ff, emissive: 0x00f5ff, emissiveIntensity: 1, transparent: true, opacity: 0.5 });
[[15, 0.04, 0.04, 0, 0.02, -7.5],[15, 0.04, 0.04, 0, 0.02, 7.5],[0.04, 0.04, 15, -7.5, 0.02, 0],[0.04, 0.04, 15, 7.5, 0.02, 0]].forEach(function(b) {
  var m = new THREE.Mesh(new THREE.BoxGeometry(b[0],b[1],b[2]), borderMat);
  m.position.set(b[3],b[4],b[5]); scene.add(m);
});

[[-6,-6],[6,-6],[-6,6],[6,6]].forEach(function(xz) {
  var pillar = new THREE.Mesh(new THREE.CylinderGeometry(0.14,0.14,3,12), stdMat(0x0d1530,0,0,1,0.9,0.2));
  pillar.position.set(xz[0],1.5,xz[1]); scene.add(pillar);
  var orb = new THREE.Mesh(new THREE.SphereGeometry(0.17,16,16), stdMat(0x00f5ff, 0x00f5ff, 1));
  orb.position.set(xz[0],3.15,xz[1]); scene.add(orb);
});

var centerRing = new THREE.Mesh(
  new THREE.TorusGeometry(1.2, 0.03, 12, 64),
  new THREE.MeshStandardMaterial({ color: 0x00f5ff, emissive: 0x00f5ff, emissiveIntensity: 0.5, transparent: true, opacity: 0.4 })
);
centerRing.rotation.x = Math.PI / 2;
centerRing.position.set(0, 0.05, 0);
scene.add(centerRing);

// ─────────────────────────────────────────────────────────────
// GUN FACTORY
// ─────────────────────────────────────────────────────────────
function makeGun(color) {
  color = color || 0x00f5ff;
  var g = new THREE.Group();
  g.add(new THREE.Mesh(new THREE.BoxGeometry(0.05,0.065,0.22), stdMat(0x0d1530,0,0,1,0.95,0.1)));
  var barrel = new THREE.Mesh(new THREE.CylinderGeometry(0.018,0.018,0.18,10), stdMat(0x1a2a4a,0,0,1,1,0.05));
  barrel.rotation.x = Math.PI/2; barrel.position.set(0,0.008,-0.18); g.add(barrel);
  var tipMat = new THREE.MeshStandardMaterial({ color: color, emissive: color, emissiveIntensity: 1 });
  var tip = new THREE.Mesh(new THREE.SphereGeometry(0.022,10,10), tipMat);
  tip.position.set(0,0.008,-0.27); g.add(tip);
  var laser = new THREE.Mesh(new THREE.CylinderGeometry(0.003,0.003,8,6), new THREE.MeshBasicMaterial({ color: color, transparent: true, opacity: 0.15 }));
  laser.rotation.x = Math.PI/2; laser.position.set(0,0.008,-4.27); g.add(laser);
  return g;
}

var desktopGun = makeGun(0x00f5ff);
desktopGun.position.set(0.28,-0.22,-0.45);
camera.add(desktopGun);

// ─────────────────────────────────────────────────────────────
// WEBXR CONTROLLERS
// ─────────────────────────────────────────────────────────────
var ctrlRight = renderer.xr.getController(0);
var ctrlLeft  = renderer.xr.getController(1);
rig.add(ctrlRight); rig.add(ctrlLeft);

var gripRight = renderer.xr.getControllerGrip(0);
var gripLeft  = renderer.xr.getControllerGrip(1);
rig.add(gripRight); rig.add(gripLeft);

var vrGun = makeGun(0x00f5ff);
vrGun.position.set(0,0,-0.05);
vrGun.rotation.x = THREE.MathUtils.degToRad(-15);
gripRight.add(vrGun);

renderer.xr.addEventListener('sessionstart', function() {
  desktopGun.visible = false;
  document.getElementById('hud').style.display = 'none';
});
renderer.xr.addEventListener('sessionend', function() {
  desktopGun.visible = true;
  document.getElementById('hud').style.display = 'block';
});

ctrlRight.addEventListener('selectstart', function() { fireBall(true); });
ctrlRight.addEventListener('squeezestart', function() { fireBall(true); });

function getGamepad(hand) {
  var session = renderer.xr.getSession();
  if (!session) return null;
  var sources = session.inputSources;
  for (var i = 0; i < sources.length; i++) {
    if (sources[i].handedness === hand && sources[i].gamepad) return sources[i].gamepad;
  }
  return null;
}

// ─────────────────────────────────────────────────────────────
// VR WORLD HUD PANEL
// ─────────────────────────────────────────────────────────────
var hudCanvas = document.createElement('canvas');
hudCanvas.width = 512; hudCanvas.height = 128;
var hudCtx = hudCanvas.getContext('2d');
var hudTex = new THREE.CanvasTexture(hudCanvas);

var hudPlane = new THREE.Mesh(
  new THREE.PlaneGeometry(2.5, 0.65),
  new THREE.MeshBasicMaterial({ map: hudTex, transparent: true, depthWrite: false, side: THREE.DoubleSide })
);
hudPlane.position.set(0, 4.5, -4);
scene.add(hudPlane);

function updateVRHud(timerVal, statusMsg) {
  hudCtx.clearRect(0,0,512,128);
  hudCtx.fillStyle = 'rgba(0,0,0,0.8)';
  hudCtx.beginPath();
  hudCtx.roundRect(0,0,512,128,16);
  hudCtx.fill();
  hudCtx.fillStyle = '#00f5ff';
  hudCtx.font = 'bold 56px monospace';
  hudCtx.textAlign = 'center';
  hudCtx.fillText(timerVal, 256, 64);
  hudCtx.fillStyle = '#aaa';
  hudCtx.font = '20px monospace';
  hudCtx.fillText(statusMsg, 256, 108);
  hudTex.needsUpdate = true;
}
updateVRHud('--', 'En attente...');

// ─────────────────────────────────────────────────────────────
// DESKTOP MOUSE LOOK
// ─────────────────────────────────────────────────────────────
var euler = new THREE.Euler(0,0,0,'YXZ');
var isLocked = false;
renderer.domElement.addEventListener('click', function() {
  if (!renderer.xr.isPresenting) renderer.domElement.requestPointerLock();
});
document.addEventListener('pointerlockchange', function() {
  isLocked = document.pointerLockElement === renderer.domElement;
});
document.addEventListener('mousemove', function(e) {
  if (!isLocked) return;
  euler.setFromQuaternion(camera.quaternion);
  euler.y -= e.movementX * 0.002;
  euler.x = Math.max(-Math.PI/2, Math.min(Math.PI/2, euler.x - e.movementY * 0.002));
  camera.quaternion.setFromEuler(euler);
});

// ─────────────────────────────────────────────────────────────
// DESKTOP WASD
// ─────────────────────────────────────────────────────────────
var keys = {};
document.addEventListener('keydown', function(e) {
  keys[e.code] = true;
  if (e.code === 'Space' || e.code === 'KeyF') fireBall(false);
});
document.addEventListener('keyup', function(e) { keys[e.code] = false; });

function moveDesktop(dt) {
  if (renderer.xr.isPresenting) return;
  var speed = 4 * dt;
  var fwd = new THREE.Vector3();
  camera.getWorldDirection(fwd); fwd.y = 0; fwd.normalize();
  var right = new THREE.Vector3().crossVectors(fwd, new THREE.Vector3(0,1,0));
  if (keys['KeyW']||keys['ArrowUp'])    rig.position.addScaledVector(fwd, speed);
  if (keys['KeyS']||keys['ArrowDown'])  rig.position.addScaledVector(fwd, -speed);
  if (keys['KeyA']||keys['ArrowLeft'])  rig.position.addScaledVector(right, -speed);
  if (keys['KeyD']||keys['ArrowRight']) rig.position.addScaledVector(right, speed);
  rig.position.x = Math.max(-7, Math.min(7, rig.position.x));
  rig.position.z = Math.max(-7, Math.min(7, rig.position.z));
}

// ─────────────────────────────────────────────────────────────
// VR THUMBSTICK LOCOMOTION
// ─────────────────────────────────────────────────────────────
function moveVR(dt) {
  var gp = getGamepad('left');
  if (!gp || !gp.axes || gp.axes.length < 2) return;
  var ax = gp.axes[2] !== undefined ? gp.axes[2] : gp.axes[0];
  var az = gp.axes[3] !== undefined ? gp.axes[3] : gp.axes[1];
  if (Math.abs(ax) < 0.12 && Math.abs(az) < 0.12) return;
  var speed = 4.5 * dt;
  var fwd = new THREE.Vector3();
  camera.getWorldDirection(fwd); fwd.y = 0; fwd.normalize();
  var right = new THREE.Vector3().crossVectors(fwd, new THREE.Vector3(0,1,0));
  rig.position.addScaledVector(right, ax * speed);
  rig.position.addScaledVector(fwd, -az * speed);
  rig.position.x = Math.max(-7, Math.min(7, rig.position.x));
  rig.position.z = Math.max(-7, Math.min(7, rig.position.z));
}

// ─────────────────────────────────────────────────────────────
// BALLS
// ─────────────────────────────────────────────────────────────
var ballsMap = {};
var BALL_SPEED = 14, BALL_LIFE = 3500, COOLDOWN = 550;
var MAX_AMMO = 5, AMMO_REGEN = 2000;
var ammo = MAX_AMMO, lastFire = 0, ballIdx = 0;

function makeBallMesh(colorHex) {
  var c = parseInt(colorHex.replace('#',''), 16);
  var g = new THREE.Group();
  g.add(new THREE.Mesh(new THREE.SphereGeometry(0.1,14,14), new THREE.MeshStandardMaterial({ color:c, emissive:c, emissiveIntensity:0.9 })));
  g.add(new THREE.Mesh(new THREE.SphereGeometry(0.16,10,10), new THREE.MeshBasicMaterial({ color:c, transparent:true, opacity:0.25 })));
  return g;
}

function fireBall(fromVR) {
  var now = Date.now();
  if (now - lastFire < COOLDOWN || ammo <= 0 || !gameActive) return;
  lastFire = now; ammo--; renderAmmo();

  var origin = new THREE.Vector3();
  var dir    = new THREE.Vector3();

  if (fromVR && renderer.xr.isPresenting) {
    gripRight.getWorldPosition(origin);
    // gripRight forward in XR is -Z of the grip object3D
    dir.set(0, 0, -1).applyQuaternion(gripRight.quaternion);
    var worldQuat = new THREE.Quaternion();
    gripRight.getWorldQuaternion(worldQuat);
    dir.set(0,0,-1).applyQuaternion(worldQuat);
    origin.addScaledVector(dir, 0.3);
  } else {
    camera.getWorldPosition(origin);
    camera.getWorldDirection(dir);
    origin.addScaledVector(dir, 0.5);
    origin.y -= 0.05;
  }

  var vel = dir.clone().multiplyScalar(BALL_SPEED);
  var id  = myId + '-' + (ballIdx++);

  spawnBall(id, {x:origin.x,y:origin.y,z:origin.z}, {x:vel.x,y:vel.y,z:vel.z}, myId, myColor);
  socket.emit('fire-ball', { ballId:id, position:{x:origin.x,y:origin.y,z:origin.z}, velocity:{x:vel.x,y:vel.y,z:vel.z} });

  if (!renderer.xr.isPresenting) screenFlash('#00f5ff');
  setTimeout(function() { ammo = Math.min(ammo+1, MAX_AMMO); renderAmmo(); }, AMMO_REGEN);
}

function spawnBall(ballId, pos, vel, shooterId, color) {
  var mesh = makeBallMesh(color || '#00f5ff');
  mesh.position.set(pos.x, pos.y, pos.z);
  scene.add(mesh);
  ballsMap[ballId] = {
    mesh: mesh, shooterId: shooterId,
    pos: new THREE.Vector3(pos.x, pos.y, pos.z),
    vel: new THREE.Vector3(vel.x, vel.y, vel.z),
    born: Date.now()
  };
  setTimeout(function() { removeBall(ballId); }, BALL_LIFE);
}

function removeBall(id) {
  if (ballsMap[id]) { scene.remove(ballsMap[id].mesh); }
  delete ballsMap[id];
}

var _tmpA = new THREE.Vector3(), _tmpB = new THREE.Vector3();

function tickBalls(dt) {
  var gravity = 9.8;
  for (var id in ballsMap) {
    var b = ballsMap[id];
    b.vel.y -= gravity * dt;
    b.pos.addScaledVector(b.vel, dt);
    if (b.pos.y < 0.1) { b.vel.y *= -0.35; b.vel.x *= 0.6; b.vel.z *= 0.6; b.pos.y = 0.1; }
    b.mesh.position.copy(b.pos);
    checkHit(id, b);
  }
}

function checkHit(ballId, b) {
  if (!gameActive) return;
  for (var id in avatars) {
    if (id === b.shooterId) continue;
    avatars[id].mesh.getWorldPosition(_tmpA);
    _tmpA.y += 1.0;
    if (b.pos.distanceTo(_tmpA) < 0.55) {
      socket.emit('ball-hit', { targetId:id, shooterId:b.shooterId, ballId:ballId });
      hitFx(b.pos.clone()); removeBall(ballId); return;
    }
  }
  if (b.shooterId !== myId) {
    camera.getWorldPosition(_tmpB);
    if (b.pos.distanceTo(_tmpB) < 0.55) {
      socket.emit('ball-hit', { targetId:myId, shooterId:b.shooterId, ballId:ballId });
      hitFx(b.pos.clone()); removeBall(ballId);
    }
  }
}

function hitFx(pos) {
  var sparks = [];
  for (var i = 0; i < 10; i++) {
    var m = new THREE.Mesh(new THREE.SphereGeometry(0.05,6,6), new THREE.MeshBasicMaterial({ color:0xff2244 }));
    m.position.copy(pos);
    scene.add(m);
    sparks.push({ mesh:m, vel:new THREE.Vector3((Math.random()-.5)*6, Math.random()*5+2, (Math.random()-.5)*6), born:Date.now() });
  }
  function anim() {
    var alive = false;
    for (var s of sparks) {
      s.vel.y -= 9 * 0.016;
      s.mesh.position.addScaledVector(s.vel, 0.016);
      if (Date.now() - s.born < 500) alive = true;
    }
    if (alive) requestAnimationFrame(anim);
    else sparks.forEach(function(s) { scene.remove(s.mesh); });
  }
  requestAnimationFrame(anim);
}

// ─────────────────────────────────────────────────────────────
// AVATARS
// ─────────────────────────────────────────────────────────────
var avatars = {};
var COLORS_INT = [0x00f5ff, 0xff00aa, 0xaaff00, 0xff8800, 0xaa00ff, 0x00ffaa];
var COLORS_HEX = ['#00f5ff','#ff00aa','#aaff00','#ff8800','#aa00ff','#00ffaa'];

function colorIntFor(id) {
  var keys = Object.keys(players); var idx = keys.indexOf(id);
  return COLORS_INT[((idx >= 0 ? idx : 0)) % COLORS_INT.length];
}

function makeAvatar(colorInt) {
  var group = new THREE.Group();
  var avMat = new THREE.MeshStandardMaterial({ color:colorInt, emissive:colorInt, emissiveIntensity:0.15, roughness:0.3, metalness:0.5 });

  var body = new THREE.Mesh(new THREE.CapsuleGeometry(0.24,0.7,8,16), avMat);
  body.position.y = 0.82; group.add(body);

  var head = new THREE.Mesh(new THREE.SphereGeometry(0.21,16,16), new THREE.MeshStandardMaterial({ color:colorInt, emissive:colorInt, emissiveIntensity:0.2, roughness:0.2, metalness:0.5 }));
  head.position.y = 1.65; group.add(head);

  [-0.08,0.08].forEach(function(ex) {
    var eye = new THREE.Mesh(new THREE.SphereGeometry(0.04,8,8), new THREE.MeshStandardMaterial({ color:0xffffff, emissive:0xffffff, emissiveIntensity:0.6 }));
    eye.position.set(ex,1.69,0.17); group.add(eye);
  });

  var miniGun = makeGun(colorInt);
  miniGun.scale.setScalar(0.9); miniGun.position.set(0.28,1.15,-0.35); group.add(miniGun);

  var ring = new THREE.Mesh(
    new THREE.TorusGeometry(0.38,0.035,10,48),
    new THREE.MeshStandardMaterial({ color:0xff2244, emissive:0xff2244, emissiveIntensity:1, transparent:true, opacity:0 })
  );
  ring.rotation.x = Math.PI/2; ring.position.y = 0.08; group.add(ring);

  // Name canvas label
  var nc = document.createElement('canvas'); nc.width=256; nc.height=64;
  var nctx = nc.getContext('2d');
  var ntex = new THREE.CanvasTexture(nc);
  var label = new THREE.Mesh(new THREE.PlaneGeometry(0.8,0.2), new THREE.MeshBasicMaterial({ map:ntex, transparent:true, depthWrite:false, side:THREE.DoubleSide }));
  label.position.y = 2.15; group.add(label);

  return { mesh:group, head:head, ring:ring, label:label, nameCanvas:nc, nameCtx:nctx, nameTex:ntex };
}

function spawnAvatar(id, player, colorHex) {
  if (avatars[id]) return;
  var c = colorIntFor(id);
  var av = makeAvatar(c);
  av.mesh.position.set(player.position.x, 0, player.position.z);

  // Draw name
  av.nameCtx.clearRect(0,0,256,64);
  av.nameCtx.fillStyle = '#' + c.toString(16).padStart(6,'0');
  av.nameCtx.font = 'bold 28px monospace';
  av.nameCtx.textAlign = 'center';
  av.nameCtx.fillText(player.name || id.slice(0,4), 128, 42);
  av.nameTex.needsUpdate = true;

  scene.add(av.mesh);
  avatars[id] = av;
}

function removeAvatar(id) {
  if (avatars[id]) { scene.remove(avatars[id].mesh); }
  delete avatars[id];
}

function moveAvatar(id, pos, rot) {
  var av = avatars[id];
  if (!av) return;
  av.mesh.position.set(pos.x, 0, pos.z);
  av.mesh.rotation.y = THREE.MathUtils.degToRad(rot.y);
  if (av.head) av.head.rotation.x = THREE.MathUtils.degToRad(rot.x * 0.3);
}

function updateItRings() {
  for (var id in avatars) {
    avatars[id].ring.material.opacity = (id === itPlayerId) ? 1 : 0;
  }
}

var ringAngle = 0;
function tickRings(dt) {
  ringAngle += dt * (2 * Math.PI / 1.2);
  for (var id in avatars) { avatars[id].ring.rotation.z = ringAngle; }
}

// ─────────────────────────────────────────────────────────────
// GAME STATE
// ─────────────────────────────────────────────────────────────
var myId = null, myColor = '#00f5ff';
var players = {}, gameActive = false, timeLeft = 0, scores = {}, itPlayerId = null;

// ─────────────────────────────────────────────────────────────
// SOCKET
// ─────────────────────────────────────────────────────────────
var socket = io();

socket.on('connect', function() {
  showOverlay('VR TAG', 'Connecté !\nEn attente d\'un autre joueur...', 'JOUEUR PRÊT');
  document.getElementById('enter-vr-btn').disabled = false;
});
socket.on('connect_error', function(err) {
  showOverlay('ERREUR', 'Impossible de joindre le serveur.\n' + err.message, '');
});
socket.on('disconnect', function() {
  showOverlay('DÉCONNECTÉ', 'Connexion perdue.\nRecharge la page.', '');
});

socket.on('init', function(d) {
  myId = d.myId; myColor = d.color;
  players = d.players; itPlayerId = d.itPlayerId;
  gameActive = d.gameActive; timeLeft = d.timeLeft;
  for (var id in d.players) { if (id !== myId) spawnAvatar(id, d.players[id], d.color); }
  if (gameActive) hideOverlay();
  else showOverlay('VR TAG', Object.keys(players).length + ' joueur(s)\nEn attente d\'un autre joueur...', 'EN ATTENTE');
  refreshUI();
});

socket.on('player-joined', function(d) {
  players[d.id] = d.player;
  spawnAvatar(d.id, d.player, d.color);
  if (!gameActive) showOverlay('VR TAG', Object.keys(players).length + ' joueur(s)\nLa partie va démarrer...', 'PRÊT');
  refreshScores();
});

socket.on('player-left', function(d) {
  removeAvatar(d.id); delete players[d.id]; refreshScores();
});
socket.on('player-moved', function(d) { moveAvatar(d.id, d.position, d.rotation); });

socket.on('game-start', function(d) {
  itPlayerId = d.itPlayerId; timeLeft = d.timeLeft; gameActive = true;
  hideOverlay(); refreshUI(); updateItRings();
});
socket.on('timer', function(d) { timeLeft = d.timeLeft; updateTimerUI(); });

socket.on('tagged', function(d) {
  itPlayerId = d.newItId; scores = d.scores;
  refreshUI(); updateItRings();
  screenFlash(itPlayerId === myId ? '#ff0022' : '#00f5ff');
});
socket.on('new-it', function(d) { itPlayerId = d.itPlayerId; refreshUI(); updateItRings(); });

socket.on('ball-fired', function(d) {
  if (d.shooterId !== myId) spawnBall(d.ballId, d.position, d.velocity, d.shooterId, d.color || '#ff00aa');
});
socket.on('waiting', function() {
  gameActive = false;
  showOverlay('VR TAG', 'Il faut 2 joueurs pour jouer', 'EN ATTENTE');
});
socket.on('game-over', function(d) {
  scores = d.scores; gameActive = false;
  var winner = null, best = -1;
  for (var id in scores) { if (scores[id] > best) { best = scores[id]; winner = id; } }
  var name = winner === myId ? 'TOI !' : (players[winner] && players[winner].name || '?');
  showOverlay('FIN !', '🏆 ' + name + ' — ' + best + ' tag(s)\nNouvelle partie dans 5s...', 'RESET...');
  refreshScores();
});

// Send position 20Hz
setInterval(function() {
  if (!myId) return;
  var rot = new THREE.Euler().setFromQuaternion(camera.quaternion, 'YXZ');
  socket.emit('move', {
    position: { x:rig.position.x, y:rig.position.y, z:rig.position.z },
    rotation: { x:THREE.MathUtils.radToDeg(rot.x), y:THREE.MathUtils.radToDeg(rot.y), z:0 }
  });
}, 50);

// ─────────────────────────────────────────────────────────────
// ENTER VR BUTTON
// ─────────────────────────────────────────────────────────────
document.getElementById('enter-vr-btn').addEventListener('click', async function() {
  if (!navigator.xr) { alert('WebXR non supporté sur ce navigateur.'); return; }
  try {
    var supported = await navigator.xr.isSessionSupported('immersive-vr');
    if (!supported) { alert('Mode VR immersif non supporté sur cet appareil.'); return; }
    var session = await navigator.xr.requestSession('immersive-vr', {
      requiredFeatures: ['local-floor'],
      optionalFeatures: ['bounded-floor', 'hand-tracking']
    });
    await renderer.xr.setSession(session);
    hideOverlay();
  } catch(e) { alert('Erreur VR : ' + e.message); }
});

// ─────────────────────────────────────────────────────────────
// UI
// ─────────────────────────────────────────────────────────────
function refreshUI() { updateTimerUI(); updateStatusUI(); refreshScores(); }

function updateTimerUI() {
  var v = Math.max(0, timeLeft);
  var el = document.getElementById('timer');
  el.textContent = v;
  el.classList.toggle('urgent', timeLeft <= 10 && timeLeft > 0);
  var statusMsg = !itPlayerId ? 'En attente...' : (itPlayerId === myId ? 'TU ES LE CHAT' : (players[itPlayerId] && players[itPlayerId].name || '?') + ' EST LE CHAT');
  updateVRHud(v + 's', statusMsg);
}

function updateStatusUI() {
  var el = document.getElementById('status');
  if (!gameActive) { el.textContent = 'En attente...'; el.className = ''; return; }
  if (itPlayerId === myId) {
    el.textContent = '🔴 TU ES LE CHAT'; el.className = 'it';
  } else {
    el.textContent = '✅ ' + (players[itPlayerId] && players[itPlayerId].name || '?') + ' EST LE CHAT';
    el.className = '';
  }
}

function refreshScores() {
  document.getElementById('scores').innerHTML = Object.entries(players)
    .map(function(e) {
      return '<div style="color:' + (e[0]===myId?'#fff':'#888') + '">' + (e[1].name||e[0].slice(0,4)) + ' — ' + (scores[e[0]]||0) + 'pt' + (e[0]===itPlayerId?' 🔴':'') + '</div>';
    }).join('');
}

function renderAmmo() {
  document.getElementById('ammo').innerHTML = Array.from({length:MAX_AMMO}, function(_,i) {
    return '<div class="dot' + (i>=ammo?' empty':'') + '"></div>';
  }).join('');
}

function screenFlash(color) {
  var f = document.getElementById('flash');
  f.style.background = color; f.style.opacity = '.25';
  setTimeout(function() { f.style.opacity = '0'; }, 300);
}

function showOverlay(title, msg, badge) {
  document.querySelector('#overlay h1').textContent = title;
  document.getElementById('overlay-msg').textContent  = msg;
  document.getElementById('overlay-badge').textContent = badge;
  document.getElementById('overlay').classList.remove('hidden');
}

function hideOverlay() {
  document.getElementById('overlay').classList.add('hidden');
}

renderAmmo();

// ─────────────────────────────────────────────────────────────
// ANIMATION LOOP
// ─────────────────────────────────────────────────────────────
var prevTime = performance.now();

renderer.setAnimationLoop(function() {
  var now = performance.now();
  var dt = Math.min((now - prevTime) / 1000, 0.05);
  prevTime = now;

  centerRing.rotation.y += dt * 0.3;
  ptCenter.intensity = 2 + Math.sin(now * 0.002) * 0.5;

  moveDesktop(dt);
  if (renderer.xr.isPresenting) moveVR(dt);

  tickBalls(dt);
  tickRings(dt);

  // Labels face camera
  var wp = new THREE.Vector3();
  camera.getWorldPosition(wp);
  for (var id in avatars) {
    if (avatars[id].label) avatars[id].label.lookAt(wp);
  }

  renderer.render(scene, camera);
});

})(); // end IIFE
</script>
</body>
</html>
